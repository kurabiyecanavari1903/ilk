<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        div {
            background-color: red;

            color: white;

            width: 100px;
            
            text-align: center;

            padding: 5px 0px;


            border-width: 2px;
            border-style: solid;
            border-color: black;

            border-radius: 10px;

            border-top-left-radius: 0px;

            border-left-color: blue;

            /* box-shadow: 1px 1px gray; */ // sag alt koseye golge verir
        }

        div:hover {
            box-shadow: 2px 2px rgb(255, 0, 174); // butona maus imlecini getirince sag alt koseye golge verir
        }

    </style>



</head>

<body>

    <div>
        Abone Ol
    </div>
    

</body>

</html>
